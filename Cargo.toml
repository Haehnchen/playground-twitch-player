[package]
name = "twitch-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
build = "build.rs"

[lib]
name = "twitch_player_core"
path = "src/lib.rs"

[[bin]]
name = "twitch-player"
path = "src/main.rs"

[[test]]
name = "settings"
path = "tests/test_settings.rs"
harness = false

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
