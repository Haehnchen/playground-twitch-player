[package]
name = "twitch-player"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
build = "build.rs"

[lib]
name = "twitch_player_core"
path = "src/lib.rs"

[[bin]]
name = "twitch-player"
path = "src/main.rs"

[profile.release]
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
m3u8-rs = "6.0.1"
serde_json = "1.0.154"
soup3 = "0.9.0"
